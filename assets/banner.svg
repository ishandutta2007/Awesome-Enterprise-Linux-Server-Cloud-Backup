<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#primaryGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #e2e8f0;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }

    /* Dynamic CSS Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.55; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.3; r: 4; }
      50% { opacity: 1; r: 7; }
    }

    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .card-anim-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .card-anim-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .data-flow {
      stroke-dasharray: 8, 8;
      animation: dashStream 2s linear infinite;
    }
    .beacon {
      animation: beaconBlink 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Behind Grid and Elements) -->
  <g filter="url(#softGlow)">
    <circle class="orb-1" cx="200" cy="120" r="140" fill="#38bdf8" />
    <circle class="orb-2" cx="1020" cy="280" r="160" fill="#818cf8" />
    <circle class="orb-1" cx="600" cy="380" r="120" fill="#c084fc" opacity="0.2" />
  </g>

  <!-- Overlay Grid Pattern -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Data Flow Lines (Dynamic Aspect in Background) -->
  <g opacity="0.45">
    <path class="data-flow" d="M 50 350 C 300 350, 400 290, 600 290 C 800 290, 900 130, 1150 130" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="data-flow" d="M 50 100 C 250 100, 350 210, 600 210 C 850 210, 950 340, 1150 340" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Dynamic Floating Decorative Tech Cards on Right Side (Keeps Left & Center Clear for Text) -->
  <g class="card-anim-1" transform="translate(900, 70)">
    <rect width="240" height="70" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" filter="url(#glow)"/>
    <circle cx="35" cy="35" r="16" fill="#0284c7" opacity="0.3"/>
    <path d="M28 35 L33 40 L42 29" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Enterprise CDP</text>
    <text x="65" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Continuous Protection</text>
  </g>

  <g class="card-anim-2" transform="translate(930, 165)">
    <rect width="230" height="70" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" filter="url(#glow)"/>
    <circle cx="35" cy="35" r="16" fill="#4f46e5" opacity="0.3"/>
    <!-- Lock / Encryption Icon -->
    <rect x="29" y="31" width="12" height="10" rx="2" fill="none" stroke="#a5b4fc" stroke-width="2"/>
    <path d="M31 31 V26 A4 4 0 0 1 39 26 V31" fill="none" stroke="#a5b4fc" stroke-width="2"/>
    <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Client Deduplication</text>
    <text x="65" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Zero-Trust Encryption</text>
  </g>

  <g class="card-anim-1" transform="translate(880, 260)">
    <rect width="250" height="70" rx="14" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" filter="url(#glow)"/>
    <circle cx="35" cy="35" r="16" fill="#9333ea" opacity="0.3"/>
    <!-- Cloud / S3 Icon -->
    <path d="M27 38 C25 38 23 36 23 33 C23 30.5 25 28.5 27.5 28.5 C28 26 30.5 24 33.5 24 C37 24 39.5 26.5 40 29.5 C42 29.5 44 31 44 33.5 C44 36 42 38 39.5 38 Z" fill="none" stroke="#d8b4fe" stroke-width="2"/>
    <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Multi-Cloud Vaults</text>
    <text x="65" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">S3, Wasabi, B2 &amp; Tape</text>
  </g>

  <!-- Foreground Content (Solid, legible, unaffected by overlays) -->
  <g transform="translate(80, 85)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="275" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle class="beacon" cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="32" y="21" class="badge-text">ENTERPRISE CURATED MATRIX</text>
    </g>

    <!-- Title and Subtitle -->
    <text x="0" y="80" class="title">Enterprise Linux Server</text>
    <text x="0" y="130" class="title" fill="#ffffff" style="fill: #ffffff;">Cloud Backup Ecosystem</text>
    <text x="0" y="180" class="subtitle">SaaS Platforms &amp; Open-Source Data Protection Frameworks</text>
    
    <text x="0" y="215" class="desc">Bare-Metal Recovery • File-Level Snapshots • Immutable Object Storage • Continuous Data Protection</text>

    <!-- Quick Stat Feature Badges -->
    <g transform="translate(0, 245)">
      <!-- Badge 1 -->
      <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ Immutable S3</text>

      <!-- Badge 2 -->
      <rect x="155" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="169" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#818cf8">🛡️ Ransomware Proof</text>

      <!-- Badge 3 -->
      <rect x="335" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="349" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#c084fc">🐧 Linux Kernel CDP</text>

      <!-- Badge 4 -->
      <rect x="510" width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="524" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#34d399">💾 Global Deduplication</text>
    </g>
  </g>
</svg>